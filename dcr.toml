[package]
name = "zlib"
version = "1.3.2.1"
type = "lib"
description = "A massively spiffy yet delicately unobtrusive compression library"
author = "Jean-loup Gailly and Mark Adler"
homepage = "https://zlib.net/"
license = "Zlib"
repository = "https://github.com/dcr-ports/zlib-port"

[build]
language = "c"
standard = "c11"
compiler = "clang"
kind = "staticlib"
roots = ["."]
src_disable = true
exclude = [
    "test/**",
    "contrib/**",
    "examples/**",
    "msdos/**",
    "os400/**",
    "qnx/**",
    "watcom/**",
    "win32/**",
    "old/**",
    "amiga/**",
    "doc/**",
    ".github/**"
]
cflags = ["-DZLIB_BUILD", "-DHAVE_HIDDEN", "-D_LARGEFILE64_SOURCE=1", "-I."]

[dependencies]
